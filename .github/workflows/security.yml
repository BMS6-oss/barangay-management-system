# =====================================================================
# BMS Security Gate — GitHub Actions Workflow
# Runs secret scanning on PRs and pushes to main
# =====================================================================
name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for history scan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets against baseline
        run: |
          detect-secrets scan --all-files --baseline .secrets.baseline
          detect-secrets audit --report --baseline .secrets.baseline || true

      - name: Run BMS Secret Scanner (full scan)
        run: python scripts/security/scan_secrets.py --full

      - name: Run BMS Security Check
        run: python scripts/security/security_check.py

      - name: Check for .env files in repository
        run: |
          ENV_FILES=$(find . -name '.env' -o -name '.env.local' -o -name '.env.production' -o -name '.env.staging' -o -name '.env.development' | grep -v node_modules | grep -v .git || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Environment files found in repository: $ENV_FILES"
            exit 1
          fi
          echo "No .env files found in repository."

      - name: Check for private key files
        run: |
          KEY_FILES=$(find . \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name 'id_rsa' -o -name 'id_ecdsa' -o -name 'id_ed25519' \) | grep -v node_modules | grep -v .git || true)
          if [ -n "$KEY_FILES" ]; then
            echo "::error::Private key files found in repository: $KEY_FILES"
            exit 1
          fi
          echo "No private key files found in repository."

      - name: Frontend bundle secret check
        run: python scripts/security/scan_secrets.py --check-build --build-dir .
