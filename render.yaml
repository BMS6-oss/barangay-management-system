# Render Blueprint Specification for Barangay Management System (BMS)
# Production Architecture: Browser -> Render -> Docker Container -> BMS Backend -> DATABASE_URL -> Managed PostgreSQL
# https://render.com/docs/blueprint-spec

databases:
  - name: bms-postgres
    databaseName: bms
    user: bmsuser
    plan: starter
    region: oregon

services:
  - type: web
    name: barangay-management-system
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: BMS_HOST
        value: 0.0.0.0
      - key: BMS_AUTO_OPEN_BROWSER
        value: "false"
      - key: BMS_REQUIRE_HTTPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: bms-postgres
          property: connectionString
      - key: BMS_UPLOADS_PATH
        value: /data/uploads
      - key: BMS_ADMIN_PASSWORD
        generateValue: true
      - key: APP_URL
        sync: false
      - key: BMS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
    disk:
      name: bms-uploads
      mountPath: /data
      sizeGB: 1
